<!----------------------------------------Scripts---------------------------------------->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let posicionAnterior = window.pageYOffset;

window.onscroll = function () {
const navbar = document.getElementById("navbar");
let posicionActual = window.pageYOffset;
if (posicionAnterior > posicionActual) {
    navbar.style.top = "0";
} else {
    navbar.style.top = "-80px";
}
posicionAnterior = posicionActual;
};

document.addEventListener("DOMContentLoaded", function () {
const menu = document.getElementById("menuNavbar");
const enlaces = document.querySelectorAll(".navbar-nav .nav-link");

enlaces.forEach((enlace) => {
    enlace.addEventListener("click", () => {
    if (menu.classList.contains("show")) {
        new bootstrap.Collapse(menu).hide();
    }
    });
});

document.addEventListener("click", (event) => {
    const isClickInside = menu.contains(event.target) || event.target.closest(".navbar-toggler");
    if (!isClickInside && menu.classList.contains("show")) {
    new bootstrap.Collapse(menu).hide();
    }
});
});
</script>
